server:
  port: 9091

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/postgres
    username: embarkx
    password: embarkx
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    # Redis connection
    data:
      redis:
        host: localhost
        port: 6379
